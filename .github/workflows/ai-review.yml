name: AI Review

on:
  pull_request_target:
    types:
    - opened
    - reopened
    - synchronize

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  review:
    name: AI Pull Request Review
    runs-on: ubuntu-latest

    steps:
      - name: Get changed files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files \
            > files.json

      - name: Build review payload
        id: review_payload
        run: |
          jq '
            map(
              select(
                (.filename | endswith(".ts")) or
                (.filename | endswith(".js")) or
                (.filename | endswith(".vue")) or
                (.filename | endswith(".tsx")) or
                (.filename | endswith(".jsx"))
              )
            )
            | map({
                filename,
                status,
                patch: (
                  if .patch then
                    .patch[0:3000]
                  else
                    "No patch available"
                  end
                )
              })
          ' files.json > review-files.json

          {
            echo "payload<<EOF"
            cat review-files.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate AI review
        id: ai_review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REVIEW_FILES: ${{ steps.review_payload.outputs.payload }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY secret is not configured."
            exit 1
          fi

          SYSTEM_PROMPT=$(cat <<'EOF'
          You are a senior software engineer performing pull request reviews.

          Your job is to review code changes and provide constructive feedback.

          Focus on:
          - Bugs and potential defects
          - Security concerns
          - Edge cases
          - Maintainability
          - Readability
          - Performance issues
          - Best practices

          Do not:
          - Comment on formatting unless it affects readability
          - Suggest unnecessary refactors
          - Invent problems that are not supported by the diff
          - Repeat the same point multiple times

          Keep feedback concise and actionable.

          Return markdown using exactly this structure:

          ## Summary

          Short summary of the changes.

          ## Potential Issues

          List possible bugs, risks, or concerns.
          If none, write "No significant issues found."

          ## Suggestions

          List actionable improvements.
          If none, write "No major improvements suggested."

          ## Positive Feedback

          Mention good practices or well-written code.
          If none, write "No additional positive feedback."

          Keep the review under 400 words.
          EOF
          )

          USER_PROMPT=$(cat <<EOF
          Review the following pull request.

          PR Title:
          $PR_TITLE

          Changed Files:
          $REVIEW_FILES
          EOF
          )

          RESPONSE=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg system "$SYSTEM_PROMPT" \
              --arg user "$USER_PROMPT" \
              '{
                model: "gpt-4o",
                messages: [
                  {
                    role: "system",
                    content: $system
                  },
                  {
                    role: "user",
                    content: $user
                  }
                ],
                max_tokens: 1000
              }'
            )")

          API_ERROR=$(echo "$RESPONSE" | jq -r '.error.message // empty')

          if [ -n "$API_ERROR" ]; then
            echo "OpenAI API Error:"
            echo "$API_ERROR"
            exit 1
          fi

          REVIEW=$(echo "$RESPONSE" | jq -r '.choices[0].message.content')

          if [ -z "$REVIEW" ] || [ "$REVIEW" = "null" ]; then
            echo "No review returned from OpenAI"
            echo "$RESPONSE"
            exit 1
          fi

          {
            echo "review<<EOF"
            echo "$REVIEW"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post AI review comment
        uses: actions/github-script@v7
        env:
          REVIEW: ${{ steps.ai_review.outputs.review }}
        with:
          script: |
            const pr = context.payload.pull_request

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: `
              🤖 AI Generated Review

              This review was generated automatically and does not replace human review.

              ${process.env.REVIEW}
              `
            })
