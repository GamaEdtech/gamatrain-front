name: AI Review Test

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  test-comment:
    runs-on: ubuntu-latest

    steps:
      - name: Add Comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: ai-review-test
          message: |
            🤖 AI Review Test

            Workflow triggered successfully.

            PR #${{ github.event.pull_request.number }}
