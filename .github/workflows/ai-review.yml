name: AI Review (Chunked)

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Get changed files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files \
            > files.json

      - name: Build chunks
        id: chunks
        run: |
          jq '
            map(
              select(
                (.filename | endswith(".ts")) or
                (.filename | endswith(".js")) or
                (.filename | endswith(".vue")) or
                (.filename | endswith(".tsx")) or
                (.filename | endswith(".jsx"))
              )
            )
          ' files.json > filtered.json

          jq -c '
            to_entries
            | group_by(.key / 5 | floor)
            | map(map(.value))
          ' filtered.json > chunks.json

          echo "chunks<<EOF" >> $GITHUB_OUTPUT
          cat chunks.json >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Review chunks with OpenAI
        id: ai
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "[]" > reviews.json

          CHUNKS=$(cat chunks.json)

          echo "$CHUNKS" | jq -c '.[]' | while read chunk; do

            RESPONSE=$(curl -s https://api.openai.com/v1/chat/completions \
              -H "Authorization: Bearer $OPENAI_API_KEY" \
              -H "Content-Type: application/json" \
              -d "$(jq -n \
                --arg chunk "$chunk" \
                '{
                  model: "gpt-4o",
                  messages: [
                    {
                      role: "system",
                      content: "You are a senior software engineer performing a code review.
                      Review the following code changes carefully.

                      Focus on:
                      - Bugs or potential runtime errors
                      - Security issues
                      - Code structure and maintainability
                      - Best practices
                      - Edge cases

                      IMPORTANT RULES:
                      - Be concise and actionable
                      - Do NOT comment on formatting or style unless it affects correctness
                      - Do NOT invent issues not supported by the code
                      - Avoid repeating the same issue multiple times
                      - Focus only on important findings

                      OUTPUT FORMAT (STRICT):

                      ## Summary
                      Brief summary of what this chunk changes.

                      ## Potential Issues
                      - Bullet list of real problems or risks (if none, write: "No significant issues found.")

                      ## Suggestions
                      - Actionable improvements (if none, write: "No major improvements suggested.")

                      ## Positive Feedback
                      - Good parts of the code (if none, write: "No notable positives.")

                      Keep the response under 300–400 words.
                    },
                    {
                      role: "user",
                      content: ("Review this code chunk:\n\n" + $chunk + "\n\nReturn issues, suggestions, positives.")
                    }
                  ],
                  max_tokens: 800
                }'
              )")

            REVIEW=$(echo "$RESPONSE" | jq -r '.choices[0].message.content')

            echo "$REVIEW" >> reviews.tmp
            echo "---" >> reviews.tmp
          done

          echo "reviews<<EOF" >> $GITHUB_OUTPUT
          cat reviews.tmp >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Final merge review
        id: final
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REVIEWS: ${{ steps.ai.outputs.reviews }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          RESPONSE=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg reviews "$REVIEWS" \
              --arg title "$PR_TITLE" \
              '{
                model: "gpt-4o",
                messages: [
                  {
                    role: "system",
                    content: "You are a senior software engineer.
                    You will be given multiple partial code review reports from different parts of a pull request.
                    Your task:
                    - Merge them into a single clean, non-redundant review
                    - Remove duplicate issues
                    - Prioritize critical problems first
                    - Keep only meaningful and actionable feedback

                    IMPORTANT RULES:
                    - Do NOT repeat the same issue
                    - Do NOT add new issues not mentioned in the inputs
                    - Keep it concise and structured
                    - Focus on overall PR quality

                    OUTPUT FORMAT (STRICT):

                    ## Summary
                    Overall summary of the pull request.

                    ## Potential Issues
                    - Consolidated list of real issues (most critical first)

                    ## Suggestions
                    - Consolidated actionable improvements

                    ## Positive Feedback
                    - Good parts across all chunks"
                  },
                  {
                    role: "user",
                    content: ("PR Title: " + $title + "\n\nCombine these reviews into one:\n\n" + $reviews)
                  }
                ],
                max_tokens: 900
              }'
            )")

          FINAL=$(echo "$RESPONSE" | jq -r '.choices[0].message.content')

          {
            echo "final<<EOF"
            echo "$FINAL"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post comment
        uses: actions/github-script@v7
        env:
          FINAL: ${{ steps.final.outputs.final }}
        with:
          script: |
            const pr = context.payload.pull_request

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: `
                🤖 AI Generated Review (Chunked)

                This review was generated automatically.

                ${process.env.FINAL}
                `
            })
