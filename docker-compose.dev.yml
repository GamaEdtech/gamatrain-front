version: "3.9"

services:
  nuxt-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: nuxt3-dev
    command: npm run dev
    working_dir: /src
    ports:
      - "3002:3002"
      - "24678:24678"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
    volumes:
      - .:/src
      - /src/node_modules
